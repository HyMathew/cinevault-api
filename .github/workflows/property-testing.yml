name: Generated JSON and BSON contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: property-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  properties:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install hashed test-only generator wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tests/properties/dependencies/requirements-hashed.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_lock.py requirements-dev.txt
      - run: python -m pip check
      - name: Audit generator dependencies in separate quality environment
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          subprocess.run([sys.executable, "-m", "venv", ".property-quality"], check=True)
          py = str(pathlib.Path(".property-quality") / ("Scripts/python.exe" if os.name == "nt" else "bin/python"))
          subprocess.run([py, "-m", "pip", "install", "-r", "requirements-quality.txt"], check=True)
          pathlib.Path("reports").mkdir(exist_ok=True)
          subprocess.run([py, "-m", "pip_audit", "-r", "tests/properties/dependencies/requirements-hashed.txt", "--no-deps", "--disable-pip", "--strict", "-f", "json", "-o", "reports/property-dependency-audit.json"], check=True)
      - name: Generate sequences against real JSON and real BSON serialization
        run: python -m pytest -q tests/properties -W error --hypothesis-show-statistics --junitxml=reports/property-tests.xml
      - name: Export bounded controller corpus for later native qualification
        run: python tests/properties/export_corpus.py --output reports/property-native-corpus.json
      - name: Keep exact run receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: properties-${{ matrix.os }}
          path: reports/property-*
          retention-days: 7
          if-no-files-found: error
  named-mutations:
    needs: properties
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tests/properties/dependencies/requirements-hashed.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_lock.py requirements-dev.txt
      - run: python -m pip check
      - name: Explicit single-patch experiments in isolated exact-commit export
        run: python tests/properties/mutation_gate.py --source-ref "${{ github.sha }}" --output "${{ runner.temp }}/property-mutations"
      - name: Keep patches, baseline and classified results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: named-mutation-experiments
          path: |
            ${{ runner.temp }}/property-mutations/*.json
            ${{ runner.temp }}/property-mutations/*.patch
            ${{ runner.temp }}/property-mutations/*.xml
            ${{ runner.temp }}/property-mutations/*.log
          retention-days: 7
          if-no-files-found: error
