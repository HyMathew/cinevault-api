name: Quality, tests and image audit
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Full commit SHA of the candidate to qualify and publish
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install quality dependencies in this isolated job
        run: python -m pip install -r requirements-quality.txt
      - name: Check quality dependency closure
        run: python scripts/check_lock.py requirements-quality.txt
      - run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Documentation and available examples
        run: python scripts/check_docs.py
      - name: OpenAPI contract
        run: python -m openapi_spec_validator docs/openapi-v1.json
      - name: Audit runtime, test and quality dependencies
        run: python scripts/audit_dependencies.py
      - name: Audit the locked MongoDB driver build tools
        run: python -m pip_audit -r docker/mongodb/build-tools.txt --no-deps --disable-pip --strict -f json -o reports/mongodb-build-tools-audit.json
      - name: Keep audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ matrix.os }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_lock.py requirements.txt requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: reports/tests.xml
          retention-days: 7
          if-no-files-found: error
  mongodb:
    # The 24.04 hosted image currently uses kernel 7.0.0, incompatible with MongoDB.
    # This gate uses the supported 6.8 kernel of the 22.04 image; application jobs stay 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Generate bounded circulation input on the controller
        run: python tests/properties/export_circulation_corpus.py --output reports/circulation-native-corpus.json
      - name: Authenticated replica set, real transactions and least-privilege application contract
        run: python scripts/check_mongodb.py --circulation-corpus reports/circulation-native-corpus.json
      - name: Keep sanitized MongoDB receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mongodb-contract
          path: |
            reports/mongodb-check.json
            reports/mongodb-tests.xml
            reports/mongodb-tests.log
            reports/circulation-native-corpus.json
          retention-days: 7
          if-no-files-found: error
  image:
    if: >-
      ${{ !(((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          !inputs.candidate_commit) ||
        (github.event_name == 'workflow_dispatch' &&
         github.repository == 'HyMathew/cinevault-api' &&
         github.ref == 'refs/heads/quality/cinevault-v2' && inputs.candidate_commit == github.sha)) }}
    needs: [quality, tests, mongodb]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Set up the pinned image builder
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          use: false
      - name: Build, non-root health and image scan
        env:
          CINEVAULT_BUILDER: ${{ steps.buildx.outputs.name }}
        run: >-
          python scripts/check_image.py --image cinevault-api:ci-$GITHUB_SHA
          --builder "$CINEVAULT_BUILDER" --source-commit "$GITHUB_SHA"
      - name: Keep image audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-audit
          path: reports/
          retention-days: 7
          if-no-files-found: error
  publish-image:
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       !inputs.candidate_commit) ||
      (github.event_name == 'workflow_dispatch' &&
       github.repository == 'HyMathew/cinevault-api' &&
       github.ref == 'refs/heads/quality/cinevault-v2' && inputs.candidate_commit == github.sha)
    needs: [quality, tests, mongodb]
    permissions:
      contents: read
      packages: write
    outputs:
      subject_name: ${{ steps.subject.outputs.name }}
      subject_digest: ${{ steps.subject.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Set up the pinned image builder
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          use: false
      - name: Build, non-root health and image scan
        env:
          CINEVAULT_BUILDER: ${{ steps.buildx.outputs.name }}
        run: >-
          python scripts/check_image.py --image cinevault-api:ci-$GITHUB_SHA
          --builder "$CINEVAULT_BUILDER" --source-commit "$GITHUB_SHA"
      - name: Publish the exact gated image under its commit tag
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_image.py
      - name: Bind the attestation subject to the registry acknowledgement
        id: subject
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          receipt = json.loads(Path("reports/registry-publication.json").read_bytes())
          repository = os.environ["GITHUB_REPOSITORY"]
          revision = os.environ["GITHUB_SHA"]
          name = "ghcr.io/" + repository.lower()
          digest = receipt["digest"]
          if (
              receipt["published"] is not True
              or receipt["repository"] != repository
              or receipt["source_commit"] != revision
              or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
              or receipt["registry_ref"] != name + "@" + digest
          ):
              raise SystemExit("Publication receipt does not match the attestation subject")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"name={name}\ndigest={digest}\n")
      - name: Keep image audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-audit
          path: reports/
          retention-days: 7
          if-no-files-found: error

  attest-image:
    name: Attest the published image digest
    if: github.repository == 'HyMathew/cinevault-api'
    needs: publish-image
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-name: ${{ needs.publish-image.outputs.subject_name }}
          subject-digest: ${{ needs.publish-image.outputs.subject_digest }}
      - name: Keep the signed image provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-signed-provenance
          path: ${{ steps.provenance.outputs.bundle-path }}
          retention-days: 7
          if-no-files-found: error

  verify-image-provenance:
    name: Verify published image provenance
    needs: [publish-image, attest-image]
    permissions:
      contents: read
      packages: read
      attestations: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify the signature and source on the exact published digest
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_NAME: ${{ needs.publish-image.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ needs.publish-image.outputs.subject_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUBJECT_NAME" == "ghcr.io/${GITHUB_REPOSITORY,,}" ]]
          [[ "$SUBJECT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -f -- "$DOCKER_CONFIG/config.json"; rmdir -- "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://$SUBJECT_NAME@$SUBJECT_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/tests.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --format json > image-attestation-verification.json
      - name: Keep the verified image provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-verified-provenance
          path: image-attestation-verification.json
          retention-days: 7
          if-no-files-found: error
