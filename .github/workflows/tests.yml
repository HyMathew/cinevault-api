name: Quality, tests and image audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install quality dependencies in this isolated job
        run: python -m pip install -r requirements-quality.txt
      - name: Check quality dependency closure
        run: python scripts/check_lock.py requirements-quality.txt
      - run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Documentation and available examples
        run: python scripts/check_docs.py
      - name: OpenAPI contract
        run: python -m openapi_spec_validator docs/openapi-v1.json
      - name: Audit runtime, test and quality dependencies
        run: python scripts/audit_dependencies.py
      - name: Audit the locked MongoDB driver build tools
        run: python -m pip_audit -r docker/mongodb/build-tools.txt --no-deps --disable-pip --strict -f json -o reports/mongodb-build-tools-audit.json
      - name: Keep audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ matrix.os }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_lock.py requirements.txt requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: reports/tests.xml
          retention-days: 7
          if-no-files-found: error
  mongodb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Authenticated replica set, real transactions and least-privilege application contract
        run: python scripts/check_mongodb.py
      - name: Keep sanitized MongoDB receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mongodb-contract
          path: |
            reports/mongodb-check.json
            reports/mongodb-tests.xml
            reports/mongodb-tests.log
          retention-days: 7
          if-no-files-found: error
  image:
    if: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    needs: [quality, tests, mongodb]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build, non-root health and image scan
        run: python scripts/check_image.py --image cinevault-api:ci-${{ github.sha }}
      - name: Keep image audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-audit
          path: reports/
          retention-days: 7
          if-no-files-found: error
  publish-image:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [quality, tests, mongodb]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build, non-root health and image scan
        run: python scripts/check_image.py --image cinevault-api:ci-${{ github.sha }}
      - name: Publish the exact gated default-branch image
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_image.py
      - name: Keep image audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-audit
          path: reports/
          retention-days: 7
          if-no-files-found: error
